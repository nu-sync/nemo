[package]
name = "nemo-dictate"
version = "0.2.0"
edition = "2024"
description = "Local Nemotron dictation for macOS"
license = "MIT"

[[bin]]
name = "nemo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
block2 = "0.6"
clap = { version = "4", features = ["derive"] }
cpal = "0.17"
ctrlc = { version = "3.5.2", features = ["termination"] }
global-hotkey = "0.9"
hound = "3.5"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "NSEvent", "block2"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.37"
toml = "0.9"
tray-icon = "0.26"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3"
