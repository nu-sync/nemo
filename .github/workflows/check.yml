name: Check

# Hosted CI is opt-in. Keep local checks available without hosted minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.NEMO_ENABLE_HOSTED_CI == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust checks
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Run the local check suite
        run: |
          rustup default 1.95.0
          cargo xtask check
      - name: Check offline process model
        run: |
          python3 scripts/verify-offline-model.py --fetch-tools --self-test --output artifacts/offline-model-ci
